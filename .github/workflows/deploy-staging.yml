name: Deploy Masaar staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: masaar-staging
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Bundle Lambda from pnpm workspace
        run: ./node_modules/.bin/esbuild apps/api/src/lambda.ts --bundle --platform=node --target=node22 --format=esm --minify --outfile=dist/lambda/index.mjs
      - run: sam build --template-file infra/template.yaml
      - name: Clear an earlier failed empty stack
        shell: bash
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name masaar-staging --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --stack-name masaar-staging
            aws cloudformation wait stack-delete-complete --stack-name masaar-staging
          fi
      - name: Deploy reviewed infrastructure and API
        run: >-
          sam deploy
          --stack-name masaar-staging
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-fail-on-empty-changeset
          --parameter-overrides
          Environment=staging
          WebOrigin=${{ vars.WEB_ORIGIN }}
          BudgetEmail=${{ vars.BUDGET_EMAIL }}
          MonthlyBudgetUsd=${{ vars.MONTHLY_BUDGET_USD }}
          SqlServerSecretName=${{ vars.SQLSERVER_SECRET_NAME }}
          VpcSubnetIds=${{ vars.VPC_SUBNET_IDS }}
          LambdaSecurityGroupId=${{ vars.LAMBDA_SECURITY_GROUP_ID }}
      - name: Publish web application
        shell: bash
        run: |
          WEB_BUCKET=$(aws cloudformation describe-stacks --stack-name masaar-staging --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" --output text)
          DISTRIBUTION=$(aws cloudformation describe-stacks --stack-name masaar-staging --query "Stacks[0].Outputs[?OutputKey=='WebDistributionId'].OutputValue" --output text)
          aws s3 sync apps/web/dist "s3://${WEB_BUCKET}" --delete
          aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION}" --paths "/*"
      - name: Verify live application
        shell: bash
        run: |
          WEB_URL=$(aws cloudformation describe-stacks --stack-name masaar-staging --query "Stacks[0].Outputs[?OutputKey=='WebUrl'].OutputValue" --output text)
          FUNCTION=$(aws cloudformation describe-stack-resource --stack-name masaar-staging --logical-resource-id ApiFunction --query 'StackResourceDetail.PhysicalResourceId' --output text)
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error "${WEB_URL}/health"; then exit 0; fi
            sleep 10
          done
          START=$(date -d '15 minutes ago' +%s); END=$(date +%s)
          QUERY='stats sum(strcontains(@message,"Task timed out")) as timeout, sum(strcontains(@message,"ImportModuleError") or strcontains(@message,"Cannot find module")) as importError, sum(strcontains(@message,"UserCodeSyntaxError") or strcontains(@message,"SyntaxError")) as syntaxError, sum(strcontains(@message,"HandlerNotFound")) as handlerError, sum(strcontains(@message,"ZodError") or strcontains(@message,"ValidationError")) as configError, sum(strcontains(@message,"Failed to connect") or strcontains(@message,"ConnectionError") or strcontains(@message,"ESOCKET") or strcontains(@message,"ETIMEDOUT") or strcontains(@message,"ETIMEOUT") or strcontains(@message,"ENOTFOUND") or strcontains(@message,"ECONNREFUSED")) as dbConnection, sum(strcontains(@message,"Login failed for user") or strcontains(@message,"ELOGIN")) as dbLogin, sum(strcontains(@message,"certificate") or strcontains(@message,"TLS") or strcontains(@message,"SSL")) as tlsError, sum(strcontains(@message,"ReferenceError")) as referenceError, sum(strcontains(@message,"TypeError")) as typeError, sum(strcontains(@message,"AccessDenied")) as accessDenied, sum(strcontains(@message,"ERROR") or strcontains(@message,"Error") or strcontains(@message,"error")) as genericError'
          QUERY_ID=$(aws logs start-query --log-group-name "/aws/lambda/${FUNCTION}" --start-time "$START" --end-time "$END" --query-string "$QUERY" --query queryId --output text)
          for wait in 1 2 3 4 5; do
            STATUS=$(aws logs get-query-results --query-id "$QUERY_ID" --query status --output text)
            [ "$STATUS" = "Complete" ] && break
            sleep 2
          done
          COUNTS=$(aws logs get-query-results --query-id "$QUERY_ID" --query 'results[0][].value' --output text)
          echo "DIAGNOSTIC_COUNTS=$COUNTS"
          exit 1
